spring.application.name=cloudsage
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloudsage_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:1.5b}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.2}
cloudsage.dataset.cpu-file=${CPU_DATASET_PATH:./dataset/Experiment_3/CPU/CPU Basic-data-2025-08-30 12_55_44.csv}
cloudsage.dataset.memory-file=${MEMORY_DATASET_PATH:./dataset/Experiment_3/RAM/Memory Basic-data-2025-08-30 12_55_55.csv}